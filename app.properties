# ============================================================
#  WebView APK Template — App Configuration
#  Edit the three values below, then build.
# ============================================================

# URL to load in the WebView on launch
app.url=https://example.com/

# Application ID — unique identifier for your app
# (used by the Play Store and Android device; must be globally unique)
app.package=com.example.myapp

# App display name shown on the home screen
app.name=My App
